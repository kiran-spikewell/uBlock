name: pmd

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '20 3 * * 5'

permissions:
  contents: read

jobs:
  pmd-code-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download JavaScript design ruleset
        run: wget -O javascript-design.xml https://raw.githubusercontent.com/pmd/pmd/master/pmd-java/src/main/resources/rulesets/javascript/design.xml
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Run PMD for JavaScript
        id: pmd
        uses: pmd/pmd-github-action@v1
        with:
          rulesets: './javascript-design.xml'  # Use the downloaded ruleset
          sourcePath: 'src/'  # Adjust the path based on your project structure
          analyzeModifiedFilesOnly: false
      
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pmd-report.sarif
